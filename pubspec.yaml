name: gasonera
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_map_location_marker: ^10.3.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_map_vector_tiles: ^2.8.1
  flutter_map_animations: ^0.10.0
  flutter_riverpod: ^3.4.2
  geolocator: ^14.0.3
  intl: ^0.20.3
  latlong2: ^0.9.1
  path: ^1.9.1
  sqflite: ^2.4.3
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
    
flutter:
  uses-material-design: true

  assets: 
    - assets/custom_ofm_bright_style_based_on_protomaps_light.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21